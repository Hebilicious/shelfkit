name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `moon ci` runs only what a change affects. That is right for a pull request
  # and wrong for `main`: on the first push there is no base revision to diff
  # against, so it resolves zero targets and reports success having run nothing.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/toolchains

      - run: pnpm install --frozen-lockfile

      - run: moon ci --include-relations

      # `wrangler check startup`, with a CPU budget: a heavy module-scope build is the documented way to trip the
      # Worker's startup limit. `moon ci` runs it when the Worker is affected; this runs it on every pull request, from
      # moon's cache when it already ran.
      - run: moon run worker:startup-check

      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: moon-ci-report
          path: .moon/cache/ciReport.json
          if-no-files-found: ignore

  # On `main` everything runs unconditionally, so a green check means the whole
  # workspace is green rather than that nothing was affected.
  full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/toolchains

      - run: pnpm install --frozen-lockfile

      - run: moon run :build :check :lint :test

      # Already part of `worker:check`; named here so the startup check is visible in CI.
      - run: moon run worker:startup-check
