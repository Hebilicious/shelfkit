name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `moon ci` runs only what a change affects. That is right for a pull request
  # and wrong for `main`: on the first push there is no base revision to diff
  # against, so it resolves zero targets and reports success having run nothing.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install pinned toolchains
        run: proto install

      - run: pnpm install --frozen-lockfile

      - run: moon ci --include-relations

      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: moon-ci-report
          path: .moon/cache/ciReport.json
          if-no-files-found: ignore

  # On `main` everything runs unconditionally, so a green check means the whole
  # workspace is green rather than that nothing was affected.
  full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      # proto installs every tool pinned in .prototools. Rust is delegated to
      # rustup, which is why the pin exists: without it the cargo shim resolves
      # no toolchain and reports cargo as missing.
      - name: Install pinned toolchains
        run: proto install

      - name: Show resolved tool versions
        run: |
          cargo --version
          rustc --version
          node --version
          pnpm --version
          moon --version

      - run: pnpm install --frozen-lockfile

      - run: moon run :build :check :lint :test
