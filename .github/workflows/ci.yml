name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `moon ci` runs only what a change affects, which is the right shape for a
  # pull request and the wrong shape for `main`: on the first push there is no
  # base revision, so it resolves zero targets and silently does nothing.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - run: pnpm install --frozen-lockfile

      - run: moon ci --include-relations

      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: moon-ci-report
          path: .moon/cache/ciReport.json
          if-no-files-found: ignore

  # On `main` everything runs, unconditionally. A green check here means the
  # whole workspace is green, not that nothing was affected.
  full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - run: pnpm install --frozen-lockfile

      - run: moon run :build :check :lint :test
