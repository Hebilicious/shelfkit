name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `moon ci` runs only what a change affects. That is right for a pull request
  # and wrong for `main`: on the first push there is no base revision to diff
  # against, so it resolves zero targets and reports success having run nothing.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The cache key includes the pins, so bumping a toolchain version cannot
      # reuse a target/ directory built by a different rustc.
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          cache-key: ${{ hashFiles('.prototools', 'rust-toolchain.toml') }}

      # proto owns every pin in .prototools, including rust, which it delegates
      # to the runner's rustup. `activate --export` emits `unset` and `export`
      # statements that $GITHUB_ENV cannot consume, so only the PATH line is
      # extracted and written to $GITHUB_PATH.
      - name: Put pinned toolchains on PATH
        run: |
          proto activate bash --export \
            | sed -n 's/^export PATH="\(.*\)";$/\1/p' \
            >> "$GITHUB_PATH"

      - name: Show resolved tool versions
        run: |
          node --version
          pnpm --version
          moon --version
          cargo --version
          rustc --version

      - run: pnpm install --frozen-lockfile

      - run: moon ci --include-relations

      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: moon-ci-report
          path: .moon/cache/ciReport.json
          if-no-files-found: ignore

  # On `main` everything runs unconditionally, so a green check means the whole
  # workspace is green rather than that nothing was affected.
  full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The cache key includes the pins, so bumping a toolchain version cannot
      # reuse a target/ directory built by a different rustc.
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          cache-key: ${{ hashFiles('.prototools', 'rust-toolchain.toml') }}

      - name: Put pinned toolchains on PATH
        run: |
          proto activate bash --export \
            | sed -n 's/^export PATH="\(.*\)";$/\1/p' \
            >> "$GITHUB_PATH"

      - name: Show resolved tool versions
        run: |
          node --version
          pnpm --version
          moon --version
          cargo --version
          rustc --version

      - run: pnpm install --frozen-lockfile

      - run: moon run :build :check :lint :test
