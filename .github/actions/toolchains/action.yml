name: Toolchains
description: Install and activate every toolchain pinned in .prototools.

runs:
  using: composite
  steps:
    - uses: moonrepo/setup-toolchain@v0
      with:
        auto-install: true

    # proto installs every pin in .prototools. Rust is delegated to rustup,
    # which proto installs itself, and rust-toolchain.toml makes rustup demand
    # that exact toolchain, so this runs before anything invokes cargo.
    - name: Install pinned toolchains
      shell: bash
      run: proto install

    # `activate --export` emits `unset` and `export` statements that
    # $GITHUB_ENV cannot consume, so only the PATH line is extracted.
    - name: Put pinned toolchains on PATH
      shell: bash
      run: |
        proto activate bash --export \
          | sed -n 's/^export PATH="\(.*\)";$/\1/p' \
          >> "$GITHUB_PATH"

    - name: Show resolved tool versions
      shell: bash
      run: |
        node --version
        pnpm --version
        moon --version
        cargo --version
        rustc --version
