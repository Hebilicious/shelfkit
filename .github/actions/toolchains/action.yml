name: Toolchains
description: Install the pinned toolchains through proto and moon.

runs:
  using: composite
  steps:
    - uses: moonrepo/setup-toolchain@v0
      with:
        auto-install: true

    # `moon setup` installs everything declared in .moon/toolchains.yml, and
    # moon puts the resolved toolchain on PATH for every task it runs, so
    # nothing after this needs PATH manipulation.
    - name: Setup toolchains
      shell: bash
      run: moon setup

    - name: Show resolved tool versions
      shell: bash
      run: |
        node --version
        pnpm --version
        moon --version
        cargo --version
        rustc --version
