name: Toolchains
description: Install the pinned toolchains through proto and moon.

runs:
  using: composite
  steps:
    - uses: moonrepo/setup-toolchain@v0
      with:
        auto-install: true

    # `moon setup` installs everything declared in .moon/toolchains.yml, and
    # moon puts the resolved toolchain on PATH for every task it runs, so
    # nothing after this needs PATH manipulation.
    - name: Setup toolchains
      shell: bash
      run: moon setup

    # The runner image ships its own rustup default (1.99.0 on ubuntu-26.04),
    # and a cargo subcommand such as clippy can resolve through it rather than
    # the pinned toolchain. Two compilers then share one target directory and
    # fail with E0514. Making the pin rustup's default, for this job and every
    # process it starts, leaves one compiler on the runner.
    - name: Make the pinned Rust the only one
      shell: bash
      run: |
        rust="$(sed -n 's/^rust *= *"\(.*\)"/\1/p' .prototools)"
        rustup default "$rust"
        # proto installs the pin with rustup's minimal profile; the gate
        # runs clippy and rustfmt, so they are added to that toolchain.
        rustup component add --toolchain "$rust" clippy rustfmt
        echo "RUSTUP_TOOLCHAIN=$rust" >> "$GITHUB_ENV"

    - name: Show resolved tool versions
      shell: bash
      run: |
        node --version
        pnpm --version
        moon --version
        cargo --version
        rustc --version
