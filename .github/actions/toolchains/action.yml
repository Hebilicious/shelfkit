name: Toolchains
description: Install and activate the pinned toolchains, from proto and rustup.

runs:
  using: composite
  steps:
    - uses: moonrepo/setup-toolchain@v0
      with:
        auto-install: true

    # proto owns node, pnpm, moon, and uv, all pinned in .prototools.
    - name: Install pinned toolchains
      shell: bash
      run: proto install

    # `activate --export` emits `unset` and `export` statements that
    # $GITHUB_ENV cannot consume, so only the PATH line is extracted.
    - name: Put pinned toolchains on PATH
      shell: bash
      run: |
        proto activate bash --export \
          | sed -n 's/^export PATH="\(.*\)";$/\1/p' \
          >> "$GITHUB_PATH"

    # Rust comes from rustup rather than proto: proto delegates rust to rustup
    # anyway, and reading the channel from rust-toolchain.toml keeps the pin in
    # exactly one place. `components: ""` means the file's own list is honoured.
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ""

    - name: Show resolved tool versions
      shell: bash
      run: |
        node --version
        pnpm --version
        moon --version
        cargo --version
        rustc --version
