name: Toolchains
description: Install and activate the pinned toolchains, from proto and rustup.

inputs:
  rust:
    description: Rust toolchain to install. Keep in step with the README.
    required: false
    default: "1.94.1"

runs:
  using: composite
  steps:
    - uses: moonrepo/setup-toolchain@v0
      with:
        auto-install: true

    # proto owns node, pnpm, moon, and uv, all pinned in .prototools.
    - name: Install pinned toolchains
      shell: bash
      run: proto install

    # `activate --export` emits `unset` and `export` statements that
    # $GITHUB_ENV cannot consume, so only the PATH line is extracted.
    - name: Put pinned toolchains on PATH
      shell: bash
      run: |
        proto activate bash --export \
          | sed -n 's/^export PATH="\(.*\)";$/\1/p' \
          >> "$GITHUB_PATH"

    # Rust is not a proto concern. proto delegates rust to rustup, and a
    # rust-toolchain.toml plus proto's own install can leave rustup pointing at
    # a toolchain with no cargo, so rustup owns rust outright: the channel is
    # passed in and this action installs it.
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust }}
        components: clippy, rustfmt

    - name: Show resolved tool versions
      shell: bash
      run: |
        node --version
        pnpm --version
        moon --version
        cargo --version
        rustc --version
