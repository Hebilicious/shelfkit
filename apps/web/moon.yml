language: typescript
layer: application
stack: frontend
tags: ["web", "vue"]

dependsOn:
  - "tokens"
  - "schema"

# Binaries are invoked by their path in node_modules/.bin. moon puts toolchain
# binaries on PATH but not a project's own, and going through a package manager
# just to reach a binary is a layer this repo does not need.
tasks:
  build:
    command: "node_modules/.bin/vite build"
    deps:
      - "tokens:build"
    inputs:
      - "src/**/*"
      - "index.html"
      - "vite.config.ts"
    outputs:
      - "dist/**/*"
  check:
    command: "node_modules/.bin/vize check"
    deps:
      - "tokens:build"
    inputs:
      - "src/**/*"
  types:
    command: "node_modules/.bin/vue-tsc --noEmit"
    deps:
      - "tokens:build"
    inputs:
      - "src/**/*"
  # vize formats and lints the Vue components; oxfmt and oxlint, from the root
  # project, own the TypeScript.
  lint:
    command: "node_modules/.bin/vize lint --max-warnings 0 src"
    deps:
      - "format-check"
    inputs:
      - "src/**/*"
  format-check:
    command: "node_modules/.bin/vize fmt --check 'src/**/*.vue'"
    inputs:
      - "src/**/*.vue"
  fix:
    command: "node_modules/.bin/vize fmt --write 'src/**/*.vue'"
    options:
      runInCI: false
  dev:
    command: "node_modules/.bin/vite"
    deps:
      - "tokens:build"
    options:
      persistent: true
      runInCI: false
  preview:
    command: "node_modules/.bin/vite preview"
    options:
      persistent: true
      runInCI: false
