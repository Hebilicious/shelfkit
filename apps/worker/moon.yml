language: typescript
layer: application
stack: backend
tags: ["worker", "cloudflare"]

fileGroups:
  sources:
    - "src/**/*"
    - "drizzle/**/*"
    - "wrangler.jsonc"
    - "tsconfig.json"
    - "/tsconfig.base.json"

# Binaries are invoked by their path in node_modules/.bin; tsx is the workspace root's.
tasks:
  build:
    command: "node_modules/.bin/wrangler deploy --dry-run --outdir dist-worker"
    # The Worker serves the SPA through its assets binding, so the SPA has to be
    # built before wrangler validates the assets directory. A task-level dep
    # rather than dependsOn, because dependsOn orders projects, not tasks.
    # The engine's build places the WASM module the Worker imports as
    # `@shelfkit/engine/shelfkit.wasm`.
    deps:
      - "web:build"
      - "engine:build"
    inputs:
      - "@group(sources)"
    outputs:
      - "dist-worker/**/*"
  typegen:
    command: "node_modules/.bin/wrangler types"
    inputs:
      - "wrangler.jsonc"
    outputs:
      - "worker-configuration.d.ts"
  check:
    command: "node_modules/.bin/tsc --noEmit"
    deps:
      - "typegen"
      - "graphql-schema-check"
      - "do-migrations-check"
      - "db-check"
      - "startup-check"
      - "check-scripts"
    inputs:
      - "@group(sources)"
      - "test/**/*"
  check-scripts:
    description: "Typecheck the Worker's Node scripts and configuration files."
    command: "node_modules/.bin/tsc --noEmit -p scripts/tsconfig.json"
    inputs:
      - "@group(sources)"
      - "scripts/**/*"
      - "drizzle.config.ts"
      - "vitest.config.ts"
  typediff:
    command: "node_modules/.bin/wrangler types --check"
    deps:
      - "typegen"
    inputs:
      - "wrangler.jsonc"
  test:
    description: "Run the Worker in workerd with Miniflare's bindings: the registry conformance suite, auth on every surface, the shelf object, and the jobs."
    command: "node_modules/.bin/vitest run --project default"
    deps:
      - "web:build"
      - "engine:build"
      - "mcp-conform"
      - "test-github"
    inputs:
      - "@group(sources)"
      - "test/**/*"
      - "vitest.config.ts"
      - "scripts/jsonc.ts"
      - "/crates/registry/conformance/**/*"
      - "/crates/core/tests/fixtures/all-kinds/**/*"
      - "/packages/importers/test/fixtures/http/**/*"
      - "/shelf/**/*"

  test-github:
    description: "The Worker tests that need GitHub sign-in enabled (vitest.config.ts's `github` project), before the default deployment's: the two projects' Miniflare instances do not run side by side."
    command: "node_modules/.bin/vitest run --project github"
    deps:
      - "web:build"
      - "engine:build"
    inputs:
      - "@group(sources)"
      - "test/**/*"
      - "vitest.config.ts"
      - "scripts/jsonc.ts"
  mcp-conform:
    description: "Run acid-cat conform against the /mcp composition (AcidCat's binding plus the relay), in Node."
    command: "node_modules/.bin/vitest run --config test/mcp/conform.config.ts"
    inputs:
      - "src/mcp/**/*"
      - "test/mcp/**/*"
      - "/packages/schema/src/**/*"

  graphql-schema:
    description: "Print the GraphQL schema to schema.graphql, the SDL clients build against."
    command: "../../node_modules/.bin/tsx scripts/graphql-schema.ts"
    options:
      cache: false
      runInCI: false
  graphql-schema-check:
    description: "Fail when schema.graphql is stale against the schema."
    command: "../../node_modules/.bin/tsx scripts/graphql-schema.ts --check"
    inputs:
      - "@group(sources)"
      - "schema.graphql"
  do-migrations:
    description: "Write wrangler.jsonc's Durable Object bindings and migration entries from src/durable-objects.ts."
    command: "../../node_modules/.bin/tsx scripts/durable-objects.ts"
    options:
      cache: false
      runInCI: false
  do-migrations-check:
    description: "Fail when wrangler.jsonc's Durable Object bindings or migrations disagree with the exported classes."
    command: "../../node_modules/.bin/tsx scripts/durable-objects.ts --check"
    inputs:
      - "src/durable-objects.ts"
      - "src/index.ts"
      - "wrangler.jsonc"
      - "scripts/jsonc.ts"
  db-generate:
    description: "Generate the shelf object's next migration from src/db/schema.ts with Drizzle Kit. Commit it."
    command: "node_modules/.bin/drizzle-kit generate"
    options:
      cache: false
      runInCI: false
  db-check:
    description: "Fail when src/db/schema.ts has changes no committed migration covers."
    command: "../../node_modules/.bin/tsx scripts/db-check.ts"
    inputs:
      - "src/db/**/*"
      - "drizzle/**/*"
      - "drizzle.config.ts"
  startup-check:
    description: "`wrangler check startup` with a CPU budget, so module scope stays light."
    command: "../../node_modules/.bin/tsx scripts/startup-check.ts"
    deps:
      - "web:build"
      - "engine:build"
    inputs:
      - "@group(sources)"

  conformance-remote:
    description: "Run the registry conformance suite against a deployment: SHELFKIT_URL, and its owner key in SHELFKIT_KEY."
    command: "../../node_modules/.bin/tsx scripts/conformance-remote.ts"
    options:
      cache: false
      runInCI: false

  local-config:
    description: "Write wrangler.local.json: wrangler.jsonc with Artifacts on Miniflare's local simulator (`remote: false`), for dev and the browser tests."
    command: "../../node_modules/.bin/tsx scripts/local-config.ts"
    options:
      cache: false
  dev:
    description: "The Worker on Miniflare, with no Cloudflare account, its repositories on the local Artifacts simulator (Git 2.32 or newer on PATH). `wrangler dev` with wrangler.jsonc uses the account's Artifacts."
    command: "node_modules/.bin/wrangler dev -c wrangler.local.json"
    deps:
      - "web:build"
      - "engine:build"
      - "local-config"
    options:
      persistent: true
      runInCI: false
  preview:
    description: "Upload the checked-out branch as a Worker Preview named after the branch, with its own Durable Objects. Pass the account as CLOUDFLARE_ACCOUNT_ID."
    command: "node_modules/.bin/wrangler preview"
    deps:
      - "web:build"
      - "engine:build"
    options:
      cache: false
      runInCI: false
  deploy:
    command: "node_modules/.bin/wrangler deploy"
    deps:
      - "web:build"
      - "engine:build"
    options:
      runInCI: false
  secret:
    command: "node_modules/.bin/wrangler secret put"
    options:
      runInCI: false
  setup:
    description: "Provision R2, the bucket lock, the queues, the Artifacts namespace, the owner key, and the session secret, deploy, check /health, then open the owner's one-time sign-in link to add a passkey. Idempotent. Pass options after `--`: --artifacts-jurisdiction eu|us, --dry-run, --keychain, --no-open, --rotate-owner-key, --rotate-session-secret, --no-github-sign-in (turn it off), and --github-sign-in (with --github-owner <login>, --github-org <org>, --recreate-github-app) to let people sign in with GitHub too."
    command: "../../node_modules/.bin/tsx ../../scripts/setup.ts"
    deps:
      - "web:build"
      - "engine:build"
    options:
      cache: false
      runInCI: false
