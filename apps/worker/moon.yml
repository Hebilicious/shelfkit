language: typescript
layer: application
stack: backend
tags: ["worker", "cloudflare"]

tasks:
  build:
    command: "pnpm run build"
    # The Worker serves the SPA through its assets binding, so the SPA has to be
    # built before wrangler validates the assets directory. A task-level dep
    # rather than dependsOn, because dependsOn orders projects, not tasks.
    deps:
      - "web:build"
    inputs:
      - "src/**/*"
      - "wrangler.jsonc"
    outputs:
      - "dist-worker/**/*"
  check:
    command: "pnpm run check"
    inputs:
      - "src/**/*"
  dev:
    command: "pnpm run dev"
    options:
      persistent: true
      runInCI: false
  deploy:
    command: "pnpm run deploy"
    deps:
      - "web:build"
    options:
      runInCI: false
