language: rust
# A library first: the WASM engine (`crates/wasm`) builds on it. The `shelfkit`
# binary is its `cli` feature.
layer: library
tags: ["crate", "compiler"]

dependsOn:
  - "core"
  - "registry"

tasks:
  build:
    description: "Build the library and the `shelfkit` binary, which the e2e suite runs. The binary is the output, so a cached build puts back the binary these inputs built, not whichever one the last build left in target/."
    command: "cargo build --package shelfkit-compiler"
    outputs:
      - "/target/debug/shelfkit"
  check:
    command: "cargo clippy --package shelfkit-compiler --all-targets -- -D warnings"
    deps:
      - "check-lib"
  check-lib:
    description: "Lint the library as the WASM engine builds it: no default features, for wasm32-unknown-unknown."
    command: "cargo clippy --package shelfkit-compiler --no-default-features --target wasm32-unknown-unknown -- -D warnings"
    deps:
      - "core:wasm-target"
  lint:
    command: "cargo fmt --package shelfkit-compiler --check"
  test:
    command: "cargo test --package shelfkit-compiler"
    # The golden tests compile ShelfKit's own shelf and the core fixtures too, and the curation tests the shelf the
    # importers build and the responses they recorded.
    inputs:
      - "**/*"
      - "/packages/importers/test/fixtures/**/*"
      - "/crates/core/src/**/*"
      - "/crates/core/tests/fixtures/**/*"
      - "/crates/registry/src/**/*"
      - "/crates/registry/conformance/**/*"
      - "/shelf/**/*"
      - "/packages/schema/acidcat.catalog.json"
      - "/Cargo.toml"
      - "/Cargo.lock"
  fmt:
    command: "cargo fmt --package shelfkit-compiler"
