[package]
name = "shelfkit-compiler"
description = "Compiles a shelf profile into a valid apm.yml plus vendored content, and the shelfkit binary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "shelfkit"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "schema"]
# The `shelfkit` command line: argument parsing, the filesystem, running APM,
# and the hosted service's client (HTTP and the OS keychain).
cli = [
  "schema",
  "dep:clap",
  "dep:ureq",
  "dep:keyring-core",
  "dep:dbus-secret-service-keyring-store",
  "dep:apple-native-keyring-store",
  "dep:windows-native-keyring-store",
  "dep:rpassword",
]
# Validation against the vendored OpenAPM JSON Schema. Native only.
schema = ["dep:jsonschema"]

[dependencies]
shelfkit-core.workspace = true
shelfkit-registry.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
clap = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { workspace = true, optional = true }

[lints]
workspace = true
