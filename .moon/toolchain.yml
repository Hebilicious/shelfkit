# Toolchain versions are pinned once, in .prototools, and installed by proto.
# This file only tells moon how to invoke a toolchain, so there is no second
# place where a version could disagree.

node:
  packageManager: pnpm

rust:
  bins:
    - "clippy"
    - "rustfmt"
  targets:
    - "x86_64-unknown-linux-gnu"
    - "aarch64-unknown-linux-gnu"

typescript:
  syncProjectReferences: false
  routeOutDirToCache: false
