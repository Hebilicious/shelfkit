# Toolchain versions are pinned once, in .prototools, and installed by proto.
# This file only tells moon how to invoke a toolchain, so there is no second
# place where a version could disagree.

node:
  packageManager: pnpm

# Rust is provided by rustup rather than proto: proto's rust registry records
# the version without materializing a cargo binary. The pin lives in
# .prototools for documentation and in CI's RUST_VERSION for enforcement.
rust:
  bins:
    - "cargo"
    - "clippy"
    - "rustfmt"
  targets:
    - "x86_64-unknown-linux-gnu"
    - "aarch64-unknown-linux-gnu"

typescript:
  syncProjectReferences: false
  routeOutDirToCache: false
