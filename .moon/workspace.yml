# The workspace is polyglot: Rust crates, TypeScript packages, two apps.
# Project globs are explicit so a new directory never joins the graph by accident.
projects:
  - "apps/*"
  - "packages/*"
  - "crates/*"

vcs:
  defaultBranch: "main"
  provider: "github"

# The Worker serves the SPA through its assets binding, so its build has to run
# after the SPA's. Moon's default layer rules forbid an application depending on
# another application, so this tag relationship expresses the one ordering we
# need without relaxing layer rules in general.
constraints:
  enforceLayerRelationships: true
  tagRelationships:
    worker:
      - "web"
      - "schema"
