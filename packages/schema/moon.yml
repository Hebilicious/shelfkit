language: typescript
layer: library
tags: ["schema", "validation"]

fileGroups:
  sources:
    - "src/**/*"
    - "scripts/**/*"
    - "test/**/*"
    - "tsconfig.json"
    - "/tsconfig.base.json"

tasks:
  build:
    command: "node_modules/.bin/tsc --noEmit"
    inputs: ["@group(sources)"]
  check:
    command: "node_modules/.bin/tsc --noEmit"
    inputs: ["@group(sources)"]
    deps:
      - "catalog-check"
  lint:
    command: "node_modules/.bin/tsc --noEmit"
    inputs: ["@group(sources)"]
  test:
    command: "node_modules/.bin/vitest run"
    # The contract tests read the Rust fixtures and golden files, and ShelfKit's own shelf.
    inputs:
      - "@group(sources)"
      - "/crates/core/tests/**/*"
      - "/crates/compiler/tests/golden/**/*"
      - "/shelf/**/*"

  catalog:
    description: "Write acidcat.catalog.json from the capability descriptors, in AcidCat's canonical form."
    command: "node scripts/generate-catalog.ts acidcat.catalog.json"
    options:
      cache: false
      runInCI: false
  catalog-fresh:
    description: "Fail when the committed acidcat.catalog.json is stale against the capability descriptors."
    command: "node scripts/generate-catalog.ts acidcat.catalog.json --check"
    inputs: ["@group(sources)", "acidcat.catalog.json", "package.json"]
  catalog-check:
    description: "Check acidcat.catalog.json against the AcidCat specification, failing on warnings too."
    command: "node_modules/.bin/acid-cat check --strict acidcat.catalog.json"
    inputs: ["acidcat.catalog.json"]
    deps:
      - "catalog-fresh"
