language: typescript
layer: library
tags: ["importers"]

project:
  title: "Importers"
  description: "Source adapters and scanners: the interface the Worker's import and upstream-check jobs dispatch to (issue #8 fills it in)."

dependsOn:
  - "schema"

fileGroups:
  sources:
    - "src/**/*"
    - "test/**/*"
    - "tsconfig.json"
    - "/tsconfig.base.json"

tasks:
  check:
    command: "node_modules/.bin/tsc --noEmit"
    inputs: ["@group(sources)"]
  lint:
    command: "node_modules/.bin/tsc --noEmit"
    inputs: ["@group(sources)"]
  test:
    command: "node_modules/.bin/vitest run"
    inputs: ["@group(sources)"]
