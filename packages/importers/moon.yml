language: typescript
layer: library
tags: ["importers"]

project:
  title: "Importers"
  description: "Source adapters (GitHub, the MCP Registry, ClawHub, other ShelfKit instances) and scanners behind the interface the Worker's import, upstream-check, and scan jobs dispatch to."

dependsOn:
  - "schema"

fileGroups:
  sources:
    - "src/**/*"
    - "test/**/*"
    - "tsconfig.json"
    - "/tsconfig.base.json"

tasks:
  check:
    command: "node_modules/.bin/tsc --noEmit"
    inputs: ["@group(sources)"]
  lint:
    command: "node_modules/.bin/tsc --noEmit"
    inputs: ["@group(sources)"]
  test:
    command: "node_modules/.bin/vitest run"
    inputs: ["@group(sources)"]
