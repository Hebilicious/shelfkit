language: typescript
layer: library
tags: ["tokens", "design-system"]

tasks:
  build:
    command: "node_modules/.bin/tsx ./run-cssforge.ts"
    inputs:
      - "cssforge.config.ts"
      - "run-cssforge.ts"
    outputs:
      - ".cssforge/**/*"
  check:
    command: "node_modules/.bin/tsx ./run-cssforge.ts"
    inputs:
      - "cssforge.config.ts"
      - "run-cssforge.ts"
  watch:
    command: "node_modules/.bin/tsx ./run-cssforge.ts --watch"
    options:
      persistent: true
      runInCI: false
