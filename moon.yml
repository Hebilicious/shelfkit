language: typescript
layer: automation
tags: ["root"]

project:
  title: "ShelfKit"
  description: "Repository-wide checks and the git hooks. Each project's own tasks live in its moon.yml."

fileGroups:
  typescript:
    - "apps/*/src/**/*"
    - "apps/*/*.ts"
    - "packages/*/src/**/*.ts"
    - "packages/*/scripts/**/*.ts"
    - "packages/*/test/**/*.ts"
    - "packages/*/*.ts"
    - "scripts/**/*.ts"
    - "tools/**/*.ts"
    - "*.config.ts"
  configs:
    - "tsconfig.json"
    - "tsconfig.base.json"
    - "apps/*/tsconfig.json"
    - "packages/*/tsconfig.json"
    - "scripts/tsconfig.json"
    - "package.json"
    - "pnpm-workspace.yaml"

# Binaries are invoked by their path in node_modules/.bin, which moon does not put on PATH.
tasks:
  lint:
    description: "Lint every TypeScript file with Ultracite's rules and the anti-slop rules, type-aware, denying warnings, after the formatting and authorship checks."
    command: "node_modules/.bin/oxlint --type-aware --deny-warnings"
    # Type-aware rules need the web app's GraphQL types, which are generated and not committed. Without this dep,
    # a run of only the affected tasks lints before they exist and reports every GraphQL result as `error` typed.
    deps:
      - "format-check"
      - "authorship-check"
      - "web:graphql-types"
    inputs:
      - "@group(typescript)"
      - "@group(configs)"
      - "oxlint.config.ts"

  format:
    description: "Format the repository with oxfmt and Ultracite's settings."
    command: "node_modules/.bin/oxfmt ."
    options:
      cache: false
      runInCI: false

  format-check:
    description: "Check the repository's formatting without changing a file."
    command: "node_modules/.bin/oxfmt --check ."
    options:
      cache: false

  authorship-check:
    description: "Refuse AI attribution in the commits this branch adds; pass a range after -- to check another."
    command: "node_modules/.bin/gommage check"
    inputs:
      - ".gommage.yml"
    options:
      cache: false

  hooks-install:
    description: "Install the lefthook git hooks for this clone."
    command: "node_modules/.bin/lefthook install"
    inputs:
      - "lefthook.yml"
    options:
      cache: false
      runInCI: false
