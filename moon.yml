language: typescript
layer: automation
tags: ["root"]

project:
  title: "ShelfKit"
  description: "Repository-wide checks. Each project's own tasks live in its moon.yml."

fileGroups:
  typescript:
    - "apps/*/src/**/*"
    - "apps/*/*.ts"
    - "packages/*/src/**/*.ts"
    - "packages/*/*.ts"
    - "scripts/**/*.ts"
    - "tools/**/*.ts"
    - "*.config.ts"
  configs:
    - "tsconfig.json"
    - "tsconfig.base.json"
    - "apps/*/tsconfig.json"
    - "packages/*/tsconfig.json"
    - "scripts/tsconfig.json"
    - "package.json"
    - "pnpm-workspace.yaml"

# Binaries are invoked by their path in node_modules/.bin, which moon does not put on PATH.
tasks:
  lint:
    description: "Lint every TypeScript file with Ultracite's rules and the anti-slop rules, type-aware, denying warnings; then the formatting check."
    command: "node_modules/.bin/oxlint --type-aware --deny-warnings"
    deps:
      - "format-check"
    inputs:
      - "@group(typescript)"
      - "@group(configs)"
      - "oxlint.config.ts"

  format:
    description: "Format the repository with oxfmt and Ultracite's settings."
    command: "node_modules/.bin/oxfmt ."
    options:
      cache: false
      runInCI: false

  format-check:
    description: "Check the repository's formatting without changing a file."
    command: "node_modules/.bin/oxfmt --check ."
    options:
      cache: false
