[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Hebilicious/shelfkit"
rust-version = "1.98"

[workspace.dependencies]
# Internal
shelfkit-core = { path = "crates/core", version = "0.0.0" }
shelfkit-compiler = { path = "crates/compiler", version = "0.0.0" }

# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
sha2 = "0.10"
walkdir = "2"
jsonschema = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Panicking on a `Result` is a bug in shipped code, but idiomatic in a test
# that has already established its preconditions.
unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
