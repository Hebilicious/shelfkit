[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Hebilicious/shelfkit"
rust-version = "1.98"

[workspace.dependencies]
# Internal
shelfkit-core = { path = "crates/core", version = "=0.1.0-rc.2" }
shelfkit-compiler = { path = "crates/compiler", version = "=0.1.0-rc.2", default-features = false }
shelfkit-registry = { path = "crates/registry", version = "=0.1.0-rc.2" }

# Shared
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` everywhere: `jsonschema` turns it on in native builds
# only, and a float must render the same bytes in the CLI and in WASM.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
thiserror = "2"
sha2 = "0.10"
walkdir = "2"
# No default features: those fetch remote schemas over the network. Validation
# is native only, because the crate cannot build for wasm32-unknown-unknown
# without wasm-bindgen imports (its hasher seeds from `getrandom`).
jsonschema = { version = "0.59", default-features = false }
clap = { version = "4", features = ["derive"] }
# The hosted service's client (`shelfkit login`, `push`, `fetch`): a blocking
# HTTP client, so the binary needs no async runtime, with rustls and Mozilla's
# roots rather than the platform's TLS.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The OS keychain `login` stores a key in: Secret Service on Linux and the BSDs
# (through libdbus, built from source so no system package is needed), the
# Keychain on macOS, and the Credential Manager on Windows.
keyring-core = "1"
dbus-secret-service-keyring-store = { version = "1", features = [
  "crypto-rust",
  "vendored",
] }
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"
# Reading a key from a terminal without echoing it.
rpassword = "7"
# gzip for registry archives, through the pure-Rust backend only, so the
# same bytes come out natively and in WASM.
flate2 = { version = "1", default-features = false, features = [
  "rust_backend",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Panicking on a `Result` is a bug in shipped code, but idiomatic in a test
# that has already established its preconditions.
unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

# The WASM engine (`crates/wasm`), built with `--profile wasm`: the release
# profile, sized for download rather than speed.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
