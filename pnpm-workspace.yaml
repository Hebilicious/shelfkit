packages:
  - "apps/*"
  - "packages/*"

# Every dependency is pinned exactly, once, here. Workspace packages name `catalog:` and never a version.
catalog:
  "@0no-co/graphql.web": 1.3.4
  "@acid-cat/cli": 0.4.0
  "@acid-cat/core-ts": 0.4.0
  "@acid-cat/spec-ts": 0.4.0
  "@cloudflare/vitest-plugin": 1.4.10
  "@gommage/cli": 0.1.0
  "@gql.tada/vue-support": 1.0.3
  "@hebilicious/cssforge": jsr:0.4.1
  "@oxlint/plugins": 1.86.0
  "@playwright/test": 1.63.0
  "@pothos/core": 4.15.1
  "@simplewebauthn/browser": 14.0.0
  "@simplewebauthn/server": 14.0.3
  "@types/node": 26.6.1
  "@valibot/to-json-schema": 1.8.0
  "@vitejs/plugin-vue": 6.0.9
  "@vizejs/vite-plugin": 0.424.10
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  gql.tada: 1.11.4
  graphql: 17.0.2
  graphql-yoga: 5.24.6
  lefthook: 2.1.15
  markdown-it: 15.0.3
  oxfmt: 0.71.0
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  sharp: 0.35.5
  source-map-js: 1.2.2
  tsx: 4.23.13
  typescript: 5.9.3
  ultracite: 7.12.2
  undici: 7.29.1
  valibot: 1.5.0
  vite: 8.3.0
  vitest: 4.1.11
  vize: 0.424.10
  vue: 3.5.43
  vue-router: 5.4.0
  vue-tsc: 3.3.11
  wrangler: 4.155.0
  yaml: 2.9.1

# Patched transitive dependencies, pinned in the catalog above. Each selector covers only the vulnerable range:
# undici and sharp come through miniflare (wrangler, the vitest pool), source-map-js through Vue's compiler.
overrides:
  "undici@>=7.0.0 <7.29.1": "catalog:"
  "sharp@<0.35.5": "catalog:"
  "source-map-js@>=1.0.0 <1.2.2": "catalog:"

# Cloudflare's local Artifacts simulator is in Miniflare (cloudflare/workers-sdk#16177), but no Wrangler release wires it
# in yet: wrangler 4.155.0 treats an Artifacts binding as remote-only, and Miniflare simulates it only when asked
# explicitly. These patches carry the runtime half of cloudflare/workers-sdk#16186, so a binding with `"remote": false`
# runs on the simulator in `wrangler dev` and the Workers Vitest pool (local mode, the e2e suite, and the Worker tests).
# Delete them, and this entry, once a Wrangler release includes #16186. After a version bump, regenerate them with
# `pnpm patch <package>@<version>`, the same edits, and `pnpm patch-commit`; a stale key fails `pnpm install`.
patchedDependencies:
  miniflare@5.20261023.2-beta: patches/miniflare@5.20261023.2-beta.patch
  wrangler@4.155.0: patches/wrangler@4.155.0.patch

# Build scripts are allowed explicitly rather than by prompt, so CI is deterministic.
allowBuilds:
  esbuild: true
  workerd: true
  # Its postinstall writes git hooks; `moon run root:hooks-install` does that on purpose.
  lefthook: false

minimumReleaseAgeExclude:
  - "@cloudflare/vitest-plugin@1.4.10"
  - miniflare@5.20261023.2-beta
  - wrangler@4.155.0
